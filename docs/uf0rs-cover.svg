    <text x="470" y="446" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#3b8a5e">model ready · 12 tools · permission: ask</text>
  </g>

  <text x="76" y="548" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="92" font-weight="700" letter-spacing="10" fill="url(#word)" filter="url(#glow)">WOPPS</text>
  <text x="80" y="590" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" letter-spacing="7" fill="#4fd97a">BY UF0RS STUDIO</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#2f7d4d">
    <text x="1006" y="540">terminal</text>
    <text x="1006" y="562">ai companion</text>
    <text x="1006" y="584" fill="#43f27b">v0.3.32</text>
