<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">UF0RS AI — terminal coding agent</title>
  <desc id="description">A neon-green terminal prompt glows through a dark, foggy forest around a quiet, abstract silhouette.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#07110d"/>
      <stop offset=".62" stop-color="#0b1c14"/>
      <stop offset="1" stop-color="#030806"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#43f27b" stop-opacity=".42"/>
      <stop offset="1" stop-color="#43f27b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fog" x2="1">
      <stop stop-color="#8efbb3" stop-opacity="0"/>
      <stop offset=".52" stop-color="#8efbb3" stop-opacity=".13"/>
      <stop offset="1" stop-color="#8efbb3" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <linearGradient id="title" x2="0" y2="1">
      <stop stop-color="#eaffef"/>
      <stop offset="1" stop-color="#78f49c"/>
    </linearGradient>
  </defs>
