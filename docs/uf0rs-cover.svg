<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">WOPPS — terminal AI companion by UF0RS STUDIO</title>
  <desc id="description">A glowing neon bunny and a terminal window in a dark green forest, with the WOPPS wordmark.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#04100b"/>
      <stop offset=".55" stop-color="#071a12"/>
      <stop offset="1" stop-color="#010503"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop stop-color="#43f27b" stop-opacity=".35"/>
      <stop offset="1" stop-color="#43f27b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="term" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#07160f"/>
      <stop offset="1" stop-color="#04100a"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#c6ffd8"/>
      <stop offset="1" stop-color="#43f27b"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>
  <ellipse cx="300" cy="300" rx="360" ry="300" fill="url(#halo)"/>
  <ellipse cx="880" cy="330" rx="420" ry="260" fill="url(#halo)" opacity=".7"/>

  <g fill="#020a07" opacity=".85">
    <polygon points="0,630 0,500 60,566 96,452 140,566 178,486 232,578 268,470 316,580 356,512 404,590 0,630"/>
    <polygon points="1200,630 1200,470 1146,556 1108,436 1064,566 1020,486 966,588 928,496 872,600 826,516 770,606 1200,630"/>
  </g>

  <g fill="#0d2c1d" opacity=".55" filter="url(#soft)">
    <ellipse cx="240" cy="560" rx="300" ry="70"/>
    <ellipse cx="960" cy="600" rx="340" ry="60"/>
  </g>

  <g transform="translate(238 336)" fill="none" stroke="#43f27b" stroke-width="7" stroke-linecap="round" filter="url(#glow)">
    <path d="M-26,-92 C-42,-136 -34,-164 -18,-164 C-4,-164 0,-138 -12,-92"/>
    <path d="M26,-92 C42,-136 34,-164 18,-164 C4,-164 0,-138 12,-92"/>
    <path d="M-33,-52 C-48,-8 -40,34 0,34 C40,34 48,-8 33,-52"/>
    <path d="M-33,-52 C-30,-80 -16,-96 0,-96 C16,-96 30,-80 33,-52"/>
  </g>
  <g fill="#9dffb8" filter="url(#glow)">
    <circle cx="222" cy="272" r="5"/>
    <circle cx="254" cy="272" r="5"/>
    <circle cx="238" cy="290" r="3.5" fill="#43f27b"/>
  </g>

  <g>
    <rect x="430" y="140" width="690" height="346" rx="16" fill="url(#term)" stroke="#2f7d4d" stroke-width="1.5"/>
    <path d="M446 182 H1104" stroke="#173f2a" stroke-width="1.5"/>
    <circle cx="470" cy="166" r="5.5" fill="#ff5f57"/>
    <circle cx="492" cy="166" r="5.5" fill="#febc2e"/>
    <circle cx="514" cy="166" r="5.5" fill="#28c840"/>
    <text x="560" y="171" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#4c9a70" letter-spacing="1">wopss — uf0rs</text>

    <text x="470" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#43f27b" filter="url(#glow)">›</text>
    <text x="500" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#d6ffe4">uf0rs .</text>
    <rect x="648" y="219" width="12" height="24" fill="#9dffb8" opacity=".9"/>

    <g fill="#2f7d4d">
      <rect x="470" y="272" width="300" height="11" rx="5.5" opacity=".55"/>
      <rect x="470" y="300" width="470" height="11" rx="5.5" opacity=".42"/>
      <rect x="470" y="328" width="380" height="11" rx="5.5" opacity=".55"/>
      <rect x="470" y="356" width="520" height="11" rx="5.5" opacity=".32"/>
    </g>
    <g fill="#43f27b" opacity=".8">
      <rect x="470" y="392" width="180" height="11" rx="5.5"/>
      <rect x="662" y="392" width="90" height="11" rx="5.5" opacity=".5"/>
